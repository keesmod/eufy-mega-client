name: Validate
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      manifest_sha256:
        description: Digest of the verified package manifest
        value: ${{ jobs.package.outputs.manifest_sha256 }}
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  dependency-security:
    uses: ./.github/workflows/dependency-security.yml
  package:
    needs: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Detect a documentation-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_scope.py
      - run: python3 scripts/check_workflows.py
      - run: python3 scripts/check_model_matrix.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Check versions, release notes and changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py check
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
      # A documentation-only change runs only the test that reads the model
      # matrix. main and every release run keep the complete suite and package.
      - name: Check the model matrix against the synthetic families
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: npm run build && node --test test/family-compatibility.test.mjs
      - name: Build and test the compiled tarball in a clean consumer
        id: bundle
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python3 scripts/release.py build
      - if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  ci:
    if: ${{ always() }}
    needs: [dependency-security, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: python3 -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'
